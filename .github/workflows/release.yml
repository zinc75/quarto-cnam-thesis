# ==============================================================================
# release.yml — Create a GitHub release on every v* tag push
# Triggered automatically when a tag matching v* is pushed.
# The annotated tag message becomes the release body.
# ==============================================================================

name: Create release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create releases

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # fetch full history so annotated tag objects are available

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Extract the annotated tag message body (everything after the subject line).
          git tag -l --format='%(contents:body)' "${{ github.ref_name }}" \
            > /tmp/release-notes.md
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
