# ==============================================================================
# docs.yml — Build FR + EN documentation and deploy to GitHub Pages
# Déclenché à chaque push sur main ; déclenchement manuel aussi disponible.
# Triggered on every push to main; manual trigger also available.
#
# Prerequisites / Prérequis :
#   • In repo Settings → Pages → Source: select "GitHub Actions"
#   • Repo must be public, or GitHub Pages must be enabled for private repos
# ==============================================================================

name: Build and deploy documentation

on:
  push:
    tags:
      - 'v*'        # triggers on v1.0, v1.1.2, etc.
  workflow_dispatch:  # manual trigger for testing

# Required for the native GitHub Pages deployment API.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress deployment — wait for it to finish.
# Ne jamais annuler un déploiement en cours — attendre qu'il se termine.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ── Source ──────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Python ──────────────────────────────────────────────────────────────
      # uv creates .venv/ at project root; Quarto auto-detects it — no manual
      # activation needed before quarto render.
      # uv crée .venv/ à la racine ; Quarto le détecte automatiquement.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create .venv and install Python dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      # ── Quarto ──────────────────────────────────────────────────────────────
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # ── TeX Live (full) ───────────────────────────────────────────────────────
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-full

      # ── System dependencies ──────────────────────────────────────────────────
      # pdftoppm (poppler-utils): used by postrender.ts to generate images/cover.png
      # from PDF page 1.
      - name: Install poppler-utils
        run: sudo apt-get install -y --no-install-recommends poppler-utils

      # ── Render ──────────────────────────────────────────────────────────────

      - name: Render FR documentation profile
        run: quarto render --profile docs-fr

      - name: Render EN documentation profile
        run: quarto render --profile docs-en

      - name: Generate landing page
        # Static HTML written directly into _site/ — no Quarto render required.
        # Calling quarto render without --profile in a book project triggers
        # "Book contents must include a home page"; writing HTML directly avoids this.
        # HTML statique écrit directement dans _site/ — quarto render sans profil évité.
        run: |
          mkdir -p _site
          VERSION="${{ github.ref_name }}"
          BUILD_DATE=$(date -u +"%Y-%m-%d")
          cat > _site/index.html << LANDING_EOF
          <!doctype html>
          <html lang="fr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>quarto-cnam-thesis</title>
            <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
            <style>
              :root { --cnam-red: #d20025; }
              body  { background: #f8f9fa; }
              .cnam-header { background: var(--cnam-red); color: #fff;
                             padding: 2.5rem 1rem 2rem; text-align: center; position: relative; }
              .cnam-header h1 { font-family: monospace; font-size: 2rem; margin-bottom: .5rem; }
              .cnam-header p  { margin: 0; opacity: .9; }
              .card-title { color: var(--cnam-red); }
              pre { background: #f4f4f4; border-radius: 4px;
                    padding: .75rem 1rem; font-size: .875rem; }
              .step-badge { display:inline-flex; align-items:center; justify-content:center;
                            width:2rem; height:2rem; border-radius:50%;
                            background:var(--cnam-red); color:#fff;
                            font-weight:700; font-size:.9rem; }
              .step-code  { background:#f4f4f4; border-radius:4px;
                            padding:.4rem .6rem; font-size:.78rem;
                            margin:0; white-space:pre-wrap; word-break:break-all; }
              .header-cnam { position:absolute; top:1.1rem; left:1.4rem; color:#fff !important;
                             font-weight:800; font-size:1.7rem; line-height:1; letter-spacing:.01em;
                             text-decoration:none; opacity:.95;
                             transition:opacity .15s ease, transform .15s ease; }
              .header-cnam .le { font-weight:400; opacity:.85; margin-right:.18rem; }
              .header-cnam:hover { opacity:1; transform:translateY(-1px); }
              .header-gh { position:absolute; top:1rem; right:1.4rem; color:#fff; opacity:.9;
                           transition:opacity .15s ease, transform .15s ease; }
              .header-gh:hover { opacity:1; transform:translateY(-1px); }
              .header-gh svg { width:40px; height:40px; }
              .gh-ico { vertical-align:-2px; }
              .step-code { position:relative; padding-right:1.9rem; }
              .copy-btn { position:absolute; top:.25rem; right:.3rem; border:0; background:transparent;
                          color:#adb5bd; cursor:pointer; padding:.12rem .2rem; border-radius:4px;
                          line-height:0; transition:color .15s ease, background .15s ease; }
              .copy-btn:hover  { color:#24292f; background:rgba(0,0,0,.06); }
              .copy-btn.copied { color:#198754; }
            </style>
          </head>
          <body>
            <header class="cnam-header">
              <a class="header-cnam" href="https://www.cnam.fr" target="_blank" rel="noopener" aria-label="Conservatoire national des arts et métiers"><span class="le">le</span>cnam</a>
              <a class="header-gh" href="https://github.com/zinc75/quarto-cnam-thesis" target="_blank" rel="noopener" aria-label="Code source sur GitHub"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg></a>
              <h1>quarto-cnam-thesis</h1>
              <p>Template Quarto pour les thèses du Cnam &middot; Quarto template for Cnam theses</p>
            </header>
            <main class="container py-5">
              <p class="lead text-center mb-3">
                Template Quarto permettant aux doctorants du Conservatoire national des arts et
                métiers de produire, depuis une seule source Markdown, un <strong>PDF/A-1b</strong>
                conforme à la maquette institutionnelle et un <strong>HTML navigable</strong> pour
                le partage et l'accessibilité.<br>
                <em class="text-muted">A Quarto template for Cnam PhD students, producing an
                archivable PDF/A-1b and a navigable HTML output from the same Markdown source.</em>
              </p>
              <p class="text-center mb-5">
                <span class="badge rounded-pill" style="background:var(--cnam-red)">$VERSION</span>
                <span class="text-muted small ms-2">$BUILD_DATE</span>
              </p>
              <div class="row g-4 mb-5">
                <div class="col-12 col-md-6">
                  <div class="card h-100 shadow-sm position-relative">
                    <div class="card-body text-center py-4">
                      <p style="font-size:2.2rem;margin:0 0 .5rem">🇫🇷</p>
                      <h3 class="card-title">Documentation française</h3>
                      <p class="card-text text-muted">
                        Guide complet&nbsp;: structure, figures, équations,<br>
                        tableaux, callouts, code Python, références.
                      </p>
                      <a href="fr/" class="btn btn-primary mt-2 stretched-link"
                         style="background:var(--cnam-red);border-color:var(--cnam-red)">
                        Lire le guide
                      </a>
                    </div>
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <div class="card h-100 shadow-sm position-relative">
                    <div class="card-body text-center py-4">
                      <p style="font-size:2.2rem;margin:0 0 .5rem">🇬🇧</p>
                      <h3 class="card-title">English documentation</h3>
                      <p class="card-text text-muted">
                        Full guide: structure, figures, equations,<br>
                        tables, callouts, Python code, references.
                      </p>
                      <a href="en/" class="btn btn-primary mt-2 stretched-link"
                         style="background:var(--cnam-red);border-color:var(--cnam-red)">
                        Read the guide
                      </a>
                    </div>
                  </div>
                </div>
              </div>
              <h2 class="h5 mt-5 mb-3">Démarrage rapide &middot; Quick start</h2>
              <div class="row g-3 mb-4">
                <div class="col-12 col-sm-6 col-lg-3">
                  <div class="card h-100 shadow-sm">
                    <div class="card-body p-3">
                      <div class="step-badge">1</div>
                      <h6 class="card-title mt-2 mb-1">Installer Quarto</h6>
                      <p class="card-text text-muted small mb-2">Install Quarto</p>
                      <a href="https://quarto.org/docs/get-started/" target="_blank"
                         class="btn btn-sm btn-outline-secondary w-100">
                        quarto.org →
                      </a>
                    </div>
                  </div>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                  <div class="card h-100 shadow-sm">
                    <div class="card-body p-3">
                      <div class="step-badge">2</div>
                      <h6 class="card-title mt-2 mb-1">Installer LaTeX</h6>
                      <p class="card-text text-muted small mb-2">Install LaTeX (skip if already installed)</p>
                      <pre class="step-code"><code>quarto install tinytex</code></pre>
                    </div>
                  </div>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                  <div class="card h-100 shadow-sm">
                    <div class="card-body p-3">
                      <div class="step-badge">3</div>
                      <h6 class="card-title mt-2 mb-1">Créer le projet</h6>
                      <p class="card-text text-muted small mb-2">Create the project</p>
                      <pre class="step-code"><code>quarto use template zinc75/quarto-cnam-thesis</code></pre>
                    </div>
                  </div>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                  <div class="card h-100 shadow-sm">
                    <div class="card-body p-3">
                      <div class="step-badge">4</div>
                      <h6 class="card-title mt-2 mb-1">Compiler</h6>
                      <p class="card-text text-muted small mb-2">Render (PDF + HTML)</p>
                      <pre class="step-code"><code>quarto render --profile fr<br>quarto render --profile en</code></pre>
                    </div>
                  </div>
                </div>
              </div>
              <p class="text-muted small">
                ℹ️ Au premier rendu, TinyTeX télécharge les packages LaTeX nécessaires (connexion internet requise).
                &bull; <em>On first render, TinyTeX downloads the required LaTeX packages (internet connection needed).</em>
              </p>
              <hr class="my-4">
              <div class="d-flex flex-wrap gap-2 align-items-center">
                <a class="btn btn-outline-secondary btn-sm"
                   href="https://github.com/zinc75/quarto-cnam-thesis#readme">
                  README (English)
                </a>
                <a class="btn btn-outline-secondary btn-sm"
                   href="https://github.com/zinc75/quarto-cnam-thesis/blob/main/README.fr.md">
                  README (Français)
                </a>
                <a class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-1"
                   href="https://github.com/zinc75/quarto-cnam-thesis" target="_blank" rel="noopener">
                  <svg class="gh-ico" viewBox="0 0 16 16" fill="currentColor" width="15" height="15" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg>
                  Code source &middot; Source code
                </a>
              </div>
            </main>
            <footer class="text-center text-muted small py-4 border-top">
              © 2026 Éric Bavu &middot;
              <a class="text-muted text-decoration-none" href="https://github.com/zinc75/quarto-cnam-thesis/blob/main/LICENSE" target="_blank" rel="noopener">MIT License</a>
            </footer>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
            <script>
              (function () {
                var COPY = '<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg>';
                var CHECK = '<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.75.75 0 0 1 1.06-1.06L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>';
                document.querySelectorAll('pre.step-code').forEach(function (pre) {
                  var btn = document.createElement('button');
                  btn.type = 'button';
                  btn.className = 'copy-btn';
                  btn.title = 'Copier · Copy';
                  btn.setAttribute('aria-label', 'Copier le code');
                  btn.innerHTML = COPY;
                  btn.addEventListener('click', function () {
                    var code = pre.querySelector('code');
                    navigator.clipboard.writeText(code.innerText).then(function () {
                      btn.classList.add('copied');
                      btn.innerHTML = CHECK;
                      setTimeout(function () { btn.classList.remove('copied'); btn.innerHTML = COPY; }, 1200);
                    });
                  });
                  pre.appendChild(btn);
                });
              }());
            </script>
          </body>
          </html>
          LANDING_EOF

      # ── Assemble _site/ ──────────────────────────────────────────────────────
      # _site/           ← landing page (index.html, self-contained)
      # _site/fr/        ← _docs-fr/   (French documentation book)
      # _site/en/        ← _docs-en/   (English documentation book)
      - name: Assemble site
        run: |
          mkdir -p _site/fr _site/en
          cp -r _docs-fr/. _site/fr/
          cp -r _docs-en/. _site/en/

      # ── Deploy ──────────────────────────────────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
