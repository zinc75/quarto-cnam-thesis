# ==============================================================================
# ENGLISH PROFILE / PROFIL ANGLAIS — quarto render --profile en
# Overrides _quarto.yml: language, chapter list, output directory /
# Surcharge _quarto.yml : langue, liste des chapitres, répertoire de sortie.
# ==============================================================================

thesis-lang: en

project:
  output-dir: _thesis-en
  post-render:
    - ./_scripts/postrender.sh en _thesis-en  # Windows (no WSL): replace .sh with .bat / remplacer .sh par .bat

book:
  output-file: these_en
  title: "User guide for the Quarto Cnam thesis template"
  subtitle: "A self-documenting thesis document"
  chapters:
    - index.qmd                                         # entry point, do not remove / point d'entrée, ne pas supprimer
    - content_en/frontmatter/acknowledgements.qmd
    - content_en/frontmatter/resume.qmd                 # French abstract (Cnam requirement) / résumé français (exigence Cnam)
    - content_en/frontmatter/abstract.qmd
    - content_en/frontmatter/tables.qmd                 # TOC + lists, do not remove / table des matières + listes, ne pas supprimer
    - content_en/frontmatter/glossaire-entries.qmd      # remove if glossaire: false / supprimer si glossaire: false
    - content_en/frontmatter/acronyms.qmd               # remove if glossaire: false / supprimer si glossaire: false
    - content_en/frontmatter/glossary.qmd               # remove if no glossary terms / supprimer si pas de termes
    - content_en/chapters/00-introduction.qmd
    - content_en/chapters/01-structure.qmd
    - content_en/chapters/02-figures.qmd
    - content_en/chapters/03-equations-tables.qmd
    - content_en/chapters/04-callouts-code.qmd
    - content_en/chapters/05-references-annotations.qmd
    - content_en/backmatter/conclusion.qmd
    - content_en/backmatter/bibliography.qmd            # between conclusion and appendices / entre conclusion et annexes
  appendices:
    - content_en/backmatter/appendices.qmd

format:
  cnam-thesis-html:
    toc-title: "Table of Contents"
