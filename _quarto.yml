# ==============================================================================
# THESIS — MAIN CONFIGURATION FILE / THÈSE — FICHIER DE CONFIGURATION PRINCIPAL
# Fill in the sections marked "TO FILL IN" / Remplir les sections "À REMPLIR".
# Do not modify "Infrastructure" unless needed / Ne pas modifier "Infrastructure"
# sauf besoin avancé.
# ==============================================================================


# ------------------------------------------------------------------------------
# TO FILL IN — Book metadata / À REMPLIR — Métadonnées du livre
# Chapter list is defined in the language profile / La liste des chapitres est
# définie dans le profil de langue :
#   quarto render --profile fr  →  content_fr/  →  _these_fr/these_fr_<author>.pdf
#   quarto render --profile en  →  content_en/  →  _thesis-en/these_en_<author>.pdf
# ------------------------------------------------------------------------------
book:
  title: "Guide d'utilisation du template Quarto Cnam pour les thèses"
  subtitle: "Un document de thèse auto-documenté"
  author: "Éric Bavu"
  # output-file and chapters are defined in the language profile /
  # output-file et chapters sont définis dans le profil de langue
  downloads: [pdf]            # adds PDF download button to the HTML sidebar / ajoute un bouton PDF dans la barre HTML

# Optional: override the HTML topbar label prefix (default: "Thèse de doctorat" / "PhD Thesis").
# Only affects the topbar — no impact on the PDF cover page or any other field.
# Useful for a documentation or GitHub Pages branch where "Thèse de doctorat" is misleading.
# Optionnel : remplace le préfixe de la barre HTML (n'affecte que la barre, pas la page de garde PDF).
# Utile pour une branche documentation ou GitHub Pages.
# header-prefix: "Documentation du template quarto-cnam-thesis"


# ------------------------------------------------------------------------------
# TO FILL IN — Cnam information (cover page)
# À REMPLIR — Informations Cnam (page de garde)
# ------------------------------------------------------------------------------

# thesis-lang is set in the language profile (_quarto-fr.yml / _quarto-en.yml) /
# thesis-lang est défini dans le profil de langue
# "fr" → babel french, French section names / noms de sections en français
# "en" → babel english, English section names / noms de sections en anglais
# Note: lang: fr is always fixed (Cnam structure is always in French) /
# Note : lang: fr reste fixe (structure Cnam toujours française)

date-soutenance: "12 Juin 2026"        # do NOT use `date:` (encoding issue) / NE PAS utiliser `date:`
discipline: "60e section CNU — Mécanique, génie mécanique, génie civil"
specialite: "Acoustique"
ecole-doctorale: "Sciences des Métiers de l'Ingénieur"
laboratoire: "Laboratoire MACS, Cnam Paris"
directeur: "M. Henri Grégoire, Abbé constitutionnel, fondateur du Cnam, Paris"
cotutelle: false                       # true → displays co-institution logo / affiche le logo co-tutelle

dedicace: "À Donald Knuth, qui a transformé la typographie en art computationnel, et à tous les doctorants qui ont perdu une journée à cause d'une accolade \\LaTeX{} manquante."


# ------------------------------------------------------------------------------
# TO FILL IN — Jury composition / À REMPLIR — Composition du jury
# ------------------------------------------------------------------------------
jury:
  - nom: "M. Jean-Antoine Chaptal"
    titre: "Professeur des Universités, Chaire de Chimie Appliquée, Conservatoire national des arts et métiers, Paris"
    role: "Président du jury"
  - nom: "M. Donald Ervin Knuth"
    titre: "Professeur émérite, Department of Computer Science, Stanford University, Palo Alto, États-Unis"
    role: "Rapporteur"
  - nom: "Mme Ada Lovelace"
    titre: "Maîtresse de Conférences HDR, Department of Mathematics, University of London, Royaume-Uni"
    role: "Rapportrice"
  - nom: "M. Jacques de Vaucanson"
    titre: "Inspecteur général des manufactures, Académie royale des sciences, Paris"
    role: "Évaluateur"
  - nom: "M. Leslie Lamport"
    titre: "Senior Principal Researcher, Microsoft Research, Redmond, États-Unis"
    role: "Évaluateur"
  - nom: "M. Henri Grégoire"
    titre: "Abbé constitutionnel, fondateur du Cnam, Conservatoire national des arts et métiers, Paris"
    role: "Directeur de thèse"


# ==============================================================================
# INFRASTRUCTURE — do not modify unless you know what you are doing /
#                  ne pas modifier sauf besoin avancé
# ==============================================================================

project:
  type: book
  # output-dir is defined in each language profile (_quarto-fr.yml / _quarto-en.yml).
  # output-dir est défini dans chaque profil de langue.
  resources:
    - images/    # ensure logos are copied to the HTML output / copier les logos vers la sortie HTML

bibliography: references.bib   # must be at project root — BibTeX (natbib) strips path / doit être à la racine — BibTeX (natbib) supprime le chemin
lang: fr

# French localisation fixes (Quarto fr defaults are incorrect) /
# Corrections de la localisation française de Quarto (valeurs par défaut erronées)
language:
  crossref-tbl-title: "Table"
  crossref-lot-title: "Liste des tables"
  crossref-lof-title: "Liste des figures"

minitoc-newpage: false   # true → \newpage after each chapter minitoc / après chaque minitoc de chapitre
chapter-openright: true  # false → chapters on any page, for digital version / pour version numérique
index: false             # true → generates an index via \index{term} / génère un index via \index{terme}

# Glossary and acronyms / Glossaire et acronymes.
# true  : loads glossaries package; glossaire-entries.qmd must be listed in chapters: /
#         charge le package glossaries ; glossaire-entries.qmd doit être dans chapters:
# false : package not loaded; acronyms.qmd displays an info message instead /
#         package non chargé ; acronyms.qmd affiche un message d'information
glossaire: true

# Differentiated page numbering by document section /
# Numérotation différenciée par portion du document.
# false (default) : continuous arabic numbering, "N/Total" footer /
#                   numérotation arabe continue, footer "N/Total"
# true  : front matter → roman (i/xii) ; body+biblio → arabic (1/89) ; appendices → Roman (I/VI) /
#         liminaire → romain (i/xii) ; corps+biblio → arabe (1/89) ; annexes → romain maj. (I/VI)
pagestyle-sections: true

# Bibliography placement / Contrôle du placement de la bibliographie.
# true (default) : managed in backmatter/bibliography.qmd, between conclusion and appendices /
#                  gérée dans backmatter/bibliography.qmd, entre conclusion et annexes
# false : placed automatically at end of document by template.tex /
#         gérée automatiquement en fin de document par template.tex
bibliography-manual: true

code-line-numbers: true

# ------------------------------------------------------------------------------
# TO FILL IN — Collaborative comments / À REMPLIR — Commentaires collaboratifs
# Extension zinc75/quarto-comments: {{< comment >}}, {{< todo >}}, {{< note >}},
# {{< question >}}.
# Add as many authors as needed; each needs a unique key, a name, and colours.
# Ajouter autant d'auteurs que nécessaire ; chaque auteur a une clé, un nom et des couleurs.
# ------------------------------------------------------------------------------
extensions:
  quarto-comments:
    enabled: false          # false → hides all comments in the output / masque tous les commentaires
    show_author: true       # false → hides author labels / masque les étiquettes auteur
    show_list: false        # true → inserts \listoftodos before body (PDF) / insère \listoftodos avant le corps (PDF)
    authors:
      eb:
        name: "Eric Bavu"
      ab:
        name: "Abbé Grégoire"
      # Add more proofreading contributors below (doctoral student, supervisors, jury members…).
      # Colors are auto-assigned from the Bootstrap 5 palette; override with color_html (hex)
      # and/or color_latex (xcolor spec) if needed. /
      # Ajouter d'autres relecteurs ci-dessous (doctorant, directeurs, membres du jury…).
      # Couleurs assignées automatiquement depuis la palette Bootstrap 5 ; surcharger avec
      # color_html (hex) et/ou color_latex (spec xcolor) si besoin :
      # nc:
      #   name: "Nicolas Conté"
      #   color_html: "#198754"    # custom green / vert personnalisé
      #   color_latex: "green!30"


jupyter: python3   # standard kernel — follows the user's active python3

execute:
  freeze: auto   # re-execute only when source changes / ne réexécute que si le code change
  echo: true     # show code by default (overridable per chunk) / affiche le code par défaut

filters:
  - quartable    # enhanced tables (colspan, rowspan, partial lines) / tables enrichies

format:
  cnam-thesis-pdf:
    keep-tex: true
  cnam-thesis-html: default
