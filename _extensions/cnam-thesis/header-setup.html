<script>
/* Builds the custom three-zone topbar: Cnam logo | thesis title | author name.
   Construit la barre d'en-tête à trois zones : logo Cnam | titre | auteur.
   Runs on DOMContentLoaded so the header elements are available.
   S'exécute sur DOMContentLoaded pour que les éléments d'en-tête soient disponibles. */
(function () {
  'use strict';

  /* Relative path from the current page back to the output root (where images/ lives).
     Chemin relatif depuis la page courante vers la racine de sortie (où se trouve images/). */
  function rootPath() {
    var el = document.querySelector('link[href*="site_libs/bootstrap"]');
    if (!el) return '';
    var href = el.getAttribute('href');
    return href.slice(0, href.indexOf('site_libs'));
  }

  /* Fixed header label: "Thèse de doctorat – Firstname LASTNAME" (fr)
                      or "PhD Thesis – Firstname LASTNAME" (en).
     Libellé fixe : identique sur toutes les pages, indépendant du chapitre courant.
     Author from <meta name="thesis-author">, lang from <meta name="thesis-lang">,
     both injected on every page by cnam-thesis.lua. */
  function headerLabel() {
    var langEl   = document.querySelector('meta[name="thesis-lang"]');
    var authorEl = document.querySelector('meta[name="thesis-author"]');
    var lang     = langEl   ? langEl.getAttribute('content')   : 'fr';
    var author   = authorEl ? authorEl.getAttribute('content') : '';
    var prefix   = lang === 'en' ? 'PhD Thesis' : 'Thèse de doctorat';
    return prefix + (author ? ' – ' + author : '');
  }

  function build() {
    var container = document.querySelector('.quarto-secondary-nav .container-fluid');
    if (!container) return;

    /* Preserve hamburger button so the sidebar toggle still works on mobile.
       Préserver le bouton hamburger pour que le basculement de barre latérale fonctionne sur mobile. */
    var hamburger = container.querySelector('.quarto-btn-toggle');
    var hamburgerHtml = hamburger ? hamburger.outerHTML : '';

    /* Preserve Quarto's search button so the detached search modal still works on
       mobile (Quarto hides the inline sidebar search and uses this button instead).
       On desktop the sidebar search is always visible, so the button can stay hidden.
       Préserver le bouton de recherche pour que le modal de recherche fonctionne sur
       mobile — Quarto cache la recherche inline et utilise ce bouton à la place.
       Sur grand écran, la recherche de la barre latérale est toujours visible. */
    var searchBtn = container.querySelector('.quarto-search-button');
    var searchBtnHtml = searchBtn ? searchBtn.outerHTML : '';

    var base  = rootPath();
    var label = headerLabel();

    container.innerHTML =
      '<div class="cnam-topbar-inner">' +
        '<div class="cnam-topbar-left">' +
          hamburgerHtml +
          '<img class="cnam-topbar-logo-img"' +
               ' src="' + base + 'images/Cnam.jpg"' +
               ' alt="Conservatoire national des arts et métiers">' +
        '</div>' +
        '<div class="cnam-topbar-center">' + label + '</div>' +
        '<div class="cnam-topbar-right">' + searchBtnHtml + '</div>' +
      '</div>';
  }

  /* Moves the PDF download tool from the sidebar header icon into a full-width
     button at the bottom of the navigation sidebar — more prominent and accessible.
     Déplace le lien de téléchargement PDF vers un bouton pleine largeur en bas
     de la barre de navigation — plus visible et accessible. */
  function buildSidebarDownload() {
    /* Find the link generated by `book: downloads: [pdf]` in _quarto.yml.
       Trouver le lien généré par `book: downloads: [pdf]` dans _quarto.yml. */
    var toolLink = document.querySelector(
      '#quarto-sidebar .sidebar-tools-main a[href*=".pdf"]'
    );
    if (!toolLink) return;

    var sidebar = document.getElementById('quarto-sidebar');
    if (!sidebar) return;

    /* Detect display language from the PDF filename (these_fr vs these_en).
       Détecter la langue d'affichage depuis le nom du fichier PDF. */
    var label = toolLink.href.indexOf('_en') !== -1
      ? 'Download PDF'
      : 'Télécharger le PDF';

    /* Build button — Bootstrap Icons (bi-*) are always bundled in Quarto HTML.
       Construire le bouton — Bootstrap Icons disponibles dans tout rendu Quarto HTML. */
    var btn = document.createElement('a');
    btn.href     = toolLink.href;
    btn.className = 'sidebar-pdf-btn';
    btn.title    = label;
    btn.setAttribute('aria-label', label);
    btn.innerHTML =
      '<i class="bi bi-file-pdf"></i>' +
      '<span>' + label + '</span>';

    var wrapper = document.createElement('div');
    wrapper.className = 'sidebar-pdf-wrapper';
    wrapper.appendChild(btn);
    sidebar.appendChild(wrapper);

    /* Hide the original small icon in the sidebar header area.
       Masquer la petite icône d'origine dans la zone d'en-tête de la barre. */
    var toolsMain = document.querySelector('#quarto-sidebar .sidebar-tools-main');
    if (toolsMain) toolsMain.style.display = 'none';
  }

  /* Moves nav.page-navigation inside main.content so it shares the same width
     as the article text — it is naturally constrained by the content column.
     Without this, the nav is a flex sibling of main at full container width
     (sidebars included), making the buttons far too spread out.
     Déplace nav.page-navigation dans main.content pour qu'elle partage la même
     largeur que le texte — contrainte naturellement par la colonne de contenu.
     Sans cela, la nav est un frère flex de main à pleine largeur (sidebars incluses),
     écartant trop les boutons. */
  /* On the cover page (index.html), wrap .thesis-book-container with an <a> that
     downloads the PDF. The wrapper is created at runtime (not in the QMD source)
     to avoid Pandoc generating a duplicate empty <a> node when it parses an <a>
     element surrounding block-level <div> children.
     The PDF href is read from the sidebar PDF button (already postrender-patched).
     Sur la page d'accueil, enveloppe .thesis-book-container avec un <a> pour
     télécharger le PDF. Le wrapper est créé au runtime pour éviter le doublon
     Pandoc. L'href est lu depuis le bouton PDF de la barre (déjà patché). */
  function linkCoverToPdf() {
    var container = document.querySelector('.thesis-book-container');
    if (!container) return;
    /* Prefer the sidebar PDF button (built by buildSidebarDownload above);
       fall back to the original hidden tool link. */
    var pdfEl = document.querySelector('.sidebar-pdf-btn')
             || document.querySelector('#quarto-sidebar .sidebar-tools-main a[href*=".pdf"]');
    if (!pdfEl || !pdfEl.href) return;

    var a = document.createElement('a');
    a.href      = pdfEl.href;
    a.className = 'thesis-book-link';
    a.setAttribute('aria-label', 'Télécharger le PDF de la thèse');
    container.parentNode.insertBefore(a, container);
    a.appendChild(container);
  }

  function repositionPageNav() {
    var nav  = document.querySelector('nav.page-navigation');
    var main = document.getElementById('quarto-document-content');
    if (nav && main) {
      main.appendChild(nav);
    }
  }

  /* Maps Pandoc/Quarto language class names to human-readable display names.
     A language class that is not in the map is title-cased (e.g. "prolog" → "Prolog").
     Convertit les noms de classes de langage en noms affichables. */
  function formatLang(lang) {
    if (!lang) return 'Code';
    var map = {
      python: 'Python', r: 'R', bash: 'Bash', sh: 'Shell', zsh: 'Zsh',
      yaml: 'YAML', json: 'JSON', html: 'HTML', css: 'CSS', scss: 'SCSS',
      javascript: 'JavaScript', js: 'JavaScript',
      typescript: 'TypeScript', ts: 'TypeScript',
      sql: 'SQL', xml: 'XML',
      latex: 'LaTeX', tex: 'LaTeX', bibtex: 'BibTeX',
      markdown: 'Markdown', md: 'Markdown',
      cpp: 'C++', c: 'C', java: 'Java', rust: 'Rust', go: 'Go',
      scala: 'Scala', julia: 'Julia', matlab: 'MATLAB', fortran: 'Fortran',
      lua: 'Lua', ruby: 'Ruby', swift: 'Swift', kotlin: 'Kotlin',
      haskell: 'Haskell', perl: 'Perl', php: 'PHP', 'r-script': 'R'
    };
    var key = lang.toLowerCase();
    return map[key] || (lang.charAt(0).toUpperCase() + lang.slice(1));
  }

  /* Extracts the programming language from a <pre> element's class list.
     Skips known non-language classes (sourceCode, numberSource, number-lines, etc.).
     Extracts le langage de programmation des classes CSS du <pre>. */
  function extractLang(pre) {
    var skip = {
      sourceCode: 1, numberSource: 1,
      'number-lines': 1, 'code-with-copy': 1
    };
    var lang = null;
    pre.classList.forEach(function(cls) {
      if (!skip[cls]) lang = cls;
    });
    return lang;
  }

  /* Injects a .code-block-title bar (icon + language name) into each code block.
     Works with the scaffold wrapper (.code-copy-outer-scaffold) produced by Quarto
     when the copy button is enabled, and falls back to bare .sourceCode divs.
     Injecte une barre de titre (icône + nom du langage) dans chaque bloc de code. */
  function buildCodeBlockTitles() {
    // Primary path: scaffold wrapper (copy button enabled — the normal case).
    // Chemin principal : scaffold (bouton de copie actif — cas normal).
    document.querySelectorAll('div.code-copy-outer-scaffold').forEach(function(scaffold) {
      if (scaffold.querySelector('.code-block-title')) return;
      var sourceDiv = scaffold.querySelector('div.sourceCode');
      if (!sourceDiv) return;
      var pre = sourceDiv.querySelector('pre');
      if (!pre) return;
      var title = document.createElement('div');
      title.className = 'code-block-title';
      title.innerHTML =
        '<i class="bi bi-code-slash"></i>' +
        '<span>' + formatLang(extractLang(pre)) + '</span>';
      scaffold.insertBefore(title, sourceDiv);
    });

    // Fallback: bare .sourceCode divs not inside a scaffold.
    // Fallback : .sourceCode sans scaffold (bouton de copie désactivé).
    document.querySelectorAll('div.sourceCode').forEach(function(div) {
      if (div.closest('.code-copy-outer-scaffold')) return;
      if (div.querySelector('.code-block-title')) return;
      var pre = div.querySelector('pre');
      if (!pre) return;
      var title = document.createElement('div');
      title.className = 'code-block-title';
      title.innerHTML =
        '<i class="bi bi-code-slash"></i>' +
        '<span>' + formatLang(extractLang(pre)) + '</span>';
      div.insertBefore(title, pre);
    });
  }

  function init() {
    build();
    buildSidebarDownload();
    linkCoverToPdf();
    repositionPageNav();
    buildCodeBlockTitles();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
