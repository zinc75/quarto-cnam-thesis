# ==============================================================================
# FRENCH DOCUMENTATION PROFILE — quarto render --profile docs-fr
# GitHub Pages / documentation build — outputs to _docs-fr/ /
# Build documentation GitHub Pages — sortie dans _docs-fr/.
# ==============================================================================

thesis-lang: fr
is-french: true    # used by index.qmd conditional divs — do not remove / utilisé par les div conditionnels de index.qmd
validate: false

project:
  output-dir: _docs-fr
  post-render:
    - ./_scripts/postrender.ts fr _docs-fr

book:
  title: "Guide d'utilisation du template Quarto Cnam pour les thèses"
  subtitle: "Un document de thèse auto-documenté"
  output-file: these_fr
  chapters:
    - index.qmd                                         # entry point, do not remove / point d'entrée, ne pas supprimer
    - documentation/content_fr/liminaire/remerciements.qmd
    - documentation/content_fr/liminaire/resume.qmd
    - documentation/content_fr/liminaire/abstract.qmd
    - documentation/content_fr/liminaire/tables.qmd                   # TOC + lists, do not remove / table des matières + listes, ne pas supprimer
    - documentation/content_fr/liminaire/glossaire-entries.qmd        # remove if glossaire: false / supprimer si glossaire: false
    - documentation/content_fr/liminaire/acronymes.qmd                # remove if glossaire: false / supprimer si glossaire: false
    - documentation/content_fr/liminaire/glossaire.qmd                # remove if no glossary terms / supprimer si pas de termes
    - documentation/content_fr/liminaire/listoftodos.qmd              # do not remove — inert when show_list: false in extensions.quarto-comments
    - documentation/content_fr/chapitres/00-introduction.qmd
    - documentation/content_fr/chapitres/01-structure.qmd             # ← add your chapters here / ajouter vos chapitres ici
    - documentation/content_fr/chapitres/02-figures.qmd
    - documentation/content_fr/chapitres/03-equations-tableaux.qmd
    - documentation/content_fr/chapitres/04-callouts-code.qmd
    - documentation/content_fr/chapitres/05-references-annotations.qmd
    - documentation/content_fr/postliminaire/conclusion.qmd
    - documentation/content_fr/postliminaire/bibliographie.qmd        # between conclusion and appendices / entre conclusion et annexes
  appendices:
    - documentation/content_fr/postliminaire/annexes.qmd
    - documentation/content_fr/postliminaire/annexes-pdfa.qmd


# Optional: override the HTML topbar label prefix (default: "Thèse de doctorat" / "PhD Thesis").
# Only affects the topbar — no impact on the PDF cover page or any other field.
# Useful for a documentation or GitHub Pages branch where "Thèse de doctorat" is misleading.
# Optionnel : remplace le préfixe de la barre HTML (n'affecte que la barre, pas la page de garde PDF).
# Utile pour une branche documentation ou GitHub Pages.
header-prefix: "Documentation du template Quarto cnam-thesis"
btn-resume: "documentation/content_fr/liminaire/resume.html"  # "Commencer la lecture" button link in index.qmd
date-soutenance: "10 Octobre 1794"        # do NOT use `date:` (encoding issue) / NE PAS utiliser `date:`

# Show collaborative comments in the documentation output /
# Afficher les commentaires collaboratifs dans la sortie documentation
extensions:
  quarto-comments:
    enabled: true
    show_list: true
    wide_margins: true
    extra_margin: "4.5cm"
